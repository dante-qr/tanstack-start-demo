name: Test PR Permissions

on:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write
            issues: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Verify gh authentication
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  gh auth status
                  gh repo view

            - name: Create test branch
              run: |
                  BRANCH=test-pr-$(date +%s)

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git checkout -b $BRANCH

                  echo "$(date)" > test-pr.txt

                  git add test-pr.txt
                  git commit -m "test: validate PR permissions"

                  git push origin $BRANCH

                  echo "BRANCH=$BRANCH" >> $GITHUB_ENV

            - name: Create PR
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  gh pr create \
                    --base main \
                    --head "$BRANCH" \
                    --title "Test PR Permissions" \
                    --body "Testing GitHub Actions permissions"

            - name: List PRs
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  gh pr list --limit 5
