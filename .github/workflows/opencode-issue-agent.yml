name: OpenCode Issue Agent

on:
    issues:
        types: [opened, edited]

jobs:
    agent:
        # Ignora issues abiertas por el propio bot para evitar loops
        if: github.event.issue.user.login != 'opencode-agent[bot]'

        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            pull-requests: write
            issues: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run OpenCode
              uses: anomalyco/opencode/github@latest
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
              with:
                  model: ${{ secrets.OPENCODE_MODEL }}
                  prompt: |
                      Eres un ingeniero de software senior colaborador de este repositorio. Siempre respondés en español.
                      Se acaba de abrir o editar la issue #${{ github.event.issue.number }}.

                      IMPORTANTE: No describas lo que vas a hacer. Hacelo directamente usando tus herramientas.
                      Cada paso implica ejecutar comandos reales, editar archivos reales y hacer push real.

                      ## PASO 1 — Comentar en la issue

                      Usá la herramienta de GitHub para dejar un comentario en la issue #${{ github.event.issue.number }}.
                      El comentario debe ser conciso y técnico, sin saludos ni relleno:

                      - Si es un bug: una línea de diagnóstico ("✅ Reproducido: ..."), causa raíz, y que el fix está en progreso en la PR #.....
                      - Si es una feature: confirmación del pedido, cómo lo vas a implementar, y que está en progreso en la PR #.....

                      ## PASO 2 — Crear la rama

                      Ejecutá `git checkout -b agent/{reason}/{name}` donde:
                      - `reason`: fix, feat, refactor, docs, test o chore según la issue
                      - `name`: slug descriptivo en inglés en kebab-case

                      ## PASO 3 — Implementar

                      Editá los archivos necesarios para resolver la issue. Respetá el estilo del proyecto.

                      ## PASO 4 — Commit y push

                      Ejecutá `git add`, `git commit` con mensaje Conventional Commits incluyendo `(#${{ github.event.issue.number }})`,
                      y `git push origin` de la rama.

                      ## PASO 5 — Abrir el PR

                      Usá la herramienta de GitHub para abrir un PR desde tu rama hacia `main` con:
                      - Título descriptivo del cambio
                      - `Fixes #${{ github.event.issue.number }}` en el body
                      - Secciones: What, Verification (y Cause si es bug)

                      ## PASO 6 — Actualizar el comentario

                      Agregá un nuevo comentario en la issue con el link al PR recién creado.

                      Si la issue es ambigua y no tiene suficiente información, solo hacé el PASO 1
                      pidiendo los datos que faltan. No toques el código.
