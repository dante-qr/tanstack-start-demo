name: OpenCode Issue Agent

on:
    issues:
        types: [opened, edited]

jobs:
    agent:
        if: github.event.issue.user.login != 'opencode-agent[bot]'

        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            pull-requests: write
            issues: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run OpenCode
              uses: anomalyco/opencode/github@latest
              env:
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  GITHUB_TOKEN: ${{ github.token }}
              with:
                  model: ${{ secrets.OPENCODE_MODEL }}
                  use_github_token: true
                  prompt: |
                      Eres un ingeniero de software senior colaborador de este repositorio. Siempre respondés en español.
                      Se acaba de abrir o editar la issue #${{ github.event.issue.number }}.

                      Tu trabajo tiene dos partes:

                      ## PARTE 1 — Análisis y comentario inmediato

                      Leé el título y la descripción de la issue con atención. Luego dejá un comentario
                      en la issue con el siguiente formato según el tipo de tarea:

                      **Si es un bug:**
                      - Una línea de diagnóstico directo: qué está fallando y por qué (ej: "✅ Reproducido: ...")
                      - Causa raíz identificada en el código (archivo, función, línea si podés)
                      - Una línea indicando que el fix está en progreso con el link al PR una vez creado

                      **Si es una feature o mejora:**
                      - Confirmación de que entendiste el pedido
                      - Breve descripción de cómo lo vas a implementar
                      - Una línea indicando que la implementación está en progreso con el link al PR

                      El comentario debe ser conciso, técnico y profesional. Sin saludos, sin relleno.
                      Mirá cómo responde `robobun` en el repo de bun como referencia de tono y formato.

                      ## PARTE 2 — Implementación

                      Después de comentar, implementá los cambios:

                      1. Creá una rama con la nomenclatura: `agent/{reason}/{name}`
                         - `reason`: fix, feat, refactor, docs, test o chore según corresponda
                         - `name`: slug descriptivo en inglés en kebab-case derivado del contexto de la issue
                         Ejemplo: `agent/fix/url-imports-fail-clearly`

                      2. Implementá la solución o feature respetando el estilo del proyecto.
                         Incluí tests si corresponde.

                      3. Commiteá siguiendo Conventional Commits:
                         `<type>(scope): descripción corta`

                      4. Abrí un PR hacia `develop` con:
                         - Título claro que describa el cambio
                         - `Fixes #${{ github.event.issue.number }}` en la descripción
                         - Sección "What" explicando qué cambia
                         - Sección "Cause" explicando por qué ocurría el problema (si es bug)
                         - Sección "Fix" describiendo la solución aplicada
                         - Sección "Verification" indicando cómo se puede verificar el fix

                      5. Actualizá tu comentario en la issue (o dejá uno nuevo) con el link al PR abierto.

                      Si la issue es ambigua o no tiene suficiente información para implementar algo con certeza,
                      solo hacé la PARTE 1: comentá pidiendo los datos que faltan de forma clara y directa.
                      En ese caso NO toques el código.
